<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#102c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2386ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2386ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000814" flood-opacity="0.72"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000814" flood-opacity="0.68"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1430" cy="86" r="500" fill="url(#glow)"/>
  <circle cx="610" cy="960" r="520" fill="url(#glow)" opacity="0.58"/>
  <path d="M0 785 C320 690 425 850 720 774 C1000 702 1210 762 1600 645 L1600 900 L0 900 Z" fill="#07111f" opacity="0.5"/>

  <text x="204" y="101" fill="#63d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">WINDOWS DESKTOP APP</text>
  <text x="204" y="137" fill="#a9bed5" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">BillMinder for PC</text>

  <text x="76" y="276" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="760" letter-spacing="-2">
    <tspan x="76">Bills handled.</tspan>
    <tspan x="76" dy="82">Before they're late.</tspan>
  </text>
  <text x="80" y="470" fill="#c4d4e5" font-family="Segoe UI, Arial, sans-serif" font-size="27">
    <tspan x="80">A private bill ledger with reminders</tspan>
    <tspan x="80" dy="41">that stay on your Windows PC.</tspan>
  </text>

  <g transform="translate(80 565)">
    <rect width="165" height="52" rx="26" fill="#132b48" stroke="#2b6497"/>
    <circle cx="27" cy="26" r="7" fill="#45e27e"/>
    <text x="47" y="34" fill="#eef7ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">No account</text>
  </g>
  <g transform="translate(260 565)">
    <rect width="177" height="52" rx="26" fill="#132b48" stroke="#2b6497"/>
    <circle cx="27" cy="26" r="7" fill="#45e27e"/>
    <text x="47" y="34" fill="#eef7ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">Local data</text>
  </g>

  <text x="80" y="814" fill="#7fa8cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">github.com/SysAdminDoc/BillMinder4PC</text>

  <rect x="640" y="120" width="892" height="613" rx="30" fill="#06101f" stroke="#2f6ea4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1068" y="556" width="444" height="309" rx="24" fill="#07111f" stroke="#39b8ea" stroke-width="2" filter="url(#smallShadow)"/>
</svg>
